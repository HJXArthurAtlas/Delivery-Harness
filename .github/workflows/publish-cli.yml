# Publish @hjxarthuratlas/che to the public npm registry when a GitHub
# Release is published — only if packages/cli carries a version that is not
# on the registry yet (i.e. the CLI actually changed).
#
# Dist-tags: `npm publish` marks the published version as `latest`
# (--tag latest is passed explicitly), so the registry always exposes both
# the exact version and the `latest` tag after a successful run.
#
# Requires repo secret NPM_TOKEN (automation token for @hjxarthuratlas).

name: publish-cli

on:
  release:
    types: [published]

permissions:
  contents: read

# 串行化发布：连发 che-v 与 vX.Y.Z 两个 Release 时，后一个 run 在前一个完成后才开始，
# 其 presence check 能看到已发布版本而干净 skip——避免并发对同一版本的 403 竞态。
concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'HJXArthurAtlas/Delivery-Harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - name: Read CLI version and verify parity
        id: ver
        run: |
          pkg="$(node -p 'require("./packages/cli/package.json").version')"
          ts="$(node -p 'require("node:fs").readFileSync("packages/cli/src/version.ts", "utf8").match(/CLI_VERSION = .([\w.]+)./)[1]')"
          [ "$pkg" = "$ts" ] || { echo "::error::version drift: package.json=$pkg version.ts=$ts"; exit 1; }
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already on npm
        id: check
        run: |
          version="${{ steps.ver.outputs.version }}"
          if npm view "@hjxarthuratlas/che@$version" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version $version already published — skipping"
            exit 0
          fi
          latest="$(npm view @hjxarthuratlas/che dist-tags.latest --registry https://registry.npmjs.org/ 2>/dev/null || true)"
          if [ -n "$latest" ]; then
            newer="$(node -e '
              const key = x => x.split(/[.-]/).map(p => (isNaN(+p) ? p : +p));
              const [a, b] = [process.argv[1], process.argv[2]].map(key);
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const x = a[i] ?? 0, y = b[i] ?? 0;
                if (x < y) process.exit(0);
                if (x > y) process.exit(1);
              }
              process.exit(1);
            ' "$version" "$latest")"
            if [ "$newer" != "1" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::warning::version $version is not newer than npm latest ($latest) — refusing to publish; dist-tag latest must move forward"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version $version not on npm — will publish"

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash packages/cli/scripts/publish.sh --tag latest

      - name: Verify published version
        if: steps.check.outputs.skip == 'false'
        run: |
          sleep 10
          published="$(npm view "@hjxarthuratlas/che@${{ steps.ver.outputs.version }}" version --registry https://registry.npmjs.org/)"
          [ "$published" = "${{ steps.ver.outputs.version }}" ] || { echo "::error::published version mismatch: $published"; exit 1; }
          latest="$(npm view @hjxarthuratlas/che dist-tags.latest --registry https://registry.npmjs.org/)"
          echo "published $published; dist-tags.latest=$latest"
