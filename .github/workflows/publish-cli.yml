# Publish @arthuratlas/che to the public npm registry when a GitHub
# Release is published — only if packages/cli carries a version that is not
# on the registry yet (i.e. the CLI actually changed).
#
# Dist-tags: `npm publish` marks the published version as `latest`
# (--tag latest is passed explicitly), so the registry always exposes both
# the exact version and the `latest` tag after a successful run.
#
# Requires repo secret NPM_TOKEN (automation token for @arthuratlas).

name: publish-cli

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'HJXArthurAtlas/Delivery-Harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - name: Read CLI version and verify parity
        id: ver
        run: |
          pkg="$(node -p 'require("./packages/cli/package.json").version')"
          ts="$(node -p 'require("node:fs").readFileSync("packages/cli/src/version.ts", "utf8").match(/CLI_VERSION = .([\w.]+)./)[1]')"
          [ "$pkg" = "$ts" ] || { echo "::error::version drift: package.json=$pkg version.ts=$ts"; exit 1; }
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already on npm
        id: check
        run: |
          if npm view "@arthuratlas/che@${{ steps.ver.outputs.version }}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version ${{ steps.ver.outputs.version }} already published — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version ${{ steps.ver.outputs.version }} not on npm — will publish"
          fi

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash packages/cli/scripts/publish.sh --tag latest

      - name: Verify published version
        if: steps.check.outputs.skip == 'false'
        run: |
          sleep 10
          published="$(npm view "@arthuratlas/che@${{ steps.ver.outputs.version }}" version --registry https://registry.npmjs.org/)"
          [ "$published" = "${{ steps.ver.outputs.version }}" ] || { echo "::error::published version mismatch: $published"; exit 1; }
          latest="$(npm view @arthuratlas/che dist-tags.latest --registry https://registry.npmjs.org/)"
          echo "published $published; dist-tags.latest=$latest"
